aid: swiftcomply
name: SwiftComply
description: >-
  SwiftComply is a cloud compliance-management platform for water utilities and
  municipalities, used by more than 700 organizations across North America to
  run their Backflow prevention, Stormwater (MS4), Industrial Pretreatment, and
  FOG (Fats, Oils, and Grease) programs. The software replaces paper and
  spreadsheet workflows with online program management, direct customer and
  service-provider reporting, real-time compliance dashboards, audit-ready
  timestamped record keeping, and pre-configured state reporting. SwiftComply
  advertises API integrations with GIS, utility billing, and other municipal
  platforms, and has held SOC 2 Type II certification since October 2021. The
  company was surfaced as a Techstars portfolio company; this profile is
  maintained by the API Evangelist network. No public developer portal, API
  reference, or machine-readable API description was found during enrichment.
